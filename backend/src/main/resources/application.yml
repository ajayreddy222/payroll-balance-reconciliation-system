spring:
  application:
    name: payroll-reconciliation
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/payroll_reconciliation
    username: payroll
    password: payroll
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt-secret: ${JWT_SECRET:default-dev-secret}
  jwt-expiration-minutes: 480
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
